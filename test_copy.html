<!DOCTYPE html>
<html>
<body>
<header id="header" class="alt">
	<h1>
		<span tabindex="0" role="button" aria-label="Copy IP address: 127.0.0.1" title="Click to copy IP" style="cursor: pointer; border-bottom: 2px dashed rgba(255,255,255,0.25);" onclick="navigator.clipboard.writeText('127.0.0.1'); var h2=this.parentElement.nextElementSibling; var orig=h2.innerText; if(orig==='Copied to clipboard!')return; h2.innerText='Copied to clipboard!'; h2.style.color='#a6d89b'; setTimeout(()=>{h2.innerText=orig; h2.style.color=''}, 2000);" onkeydown="if(event.key==='Enter'||event.key===' ') { event.preventDefault(); this.click(); }">127.0.0.1</span>
	</h1>
	<h2>Your IP Address.</h2>
	<p>by <a href="/">ip.cciicc.cc</a></p>
</header>
</body>
