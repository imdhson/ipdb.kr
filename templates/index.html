<html lang="en">
	<head>
		<title>{{.IP}}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--[if lte IE 8]><script src="/assets/js/ie/html5shiv.js"></script><![endif]-->
		<link rel="stylesheet" href="/assets/css/main.css" />
		<!--[if lte IE 9]><link rel="stylesheet" href="/assets/css/ie9.css" /><![endif]-->
		<!--[if lte IE 8]><link rel="stylesheet" href="/assets/css/ie8.css" /><![endif]-->
		<style>
		table {
				border-collapse: collapse;
				width: 100%;
		}

		td, th {
				border: 1px solid #dddddd;
				text-align: left;
				padding: 8px;
		}

		tr:nth-child(even) {
				background-color: #dddddd;
		}
		</style>
	</head>
	<body>
		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Header -->
					<header id="header" class="alt">
						<h1>{{.IP}}</h1>
						<h2>Your IP Address.</h2>
						<p>by <a href="/">ip.cciicc.cc</a></p>
					</header>

				<!-- Nav -->
					<nav id="nav" aria-label="Main navigation">
						<ul>
							<li><a href="#dash" class="active">Dashboard</a></li>
							<li><a href="/terms" class="active">Terms</a></li>
						</ul>
					</nav>

				<!-- Main -->
					<div id="main">

						<!-- Introduction -->
							<section id="dash" class="main">
								<div class="spotlight">
									<div class="content">
										<header class="major">
											<h2>IP Dashboard</h2>
										</header>
										<p><a href="#footer" class="scrolly">Go to Bottom.</a></p>
										<table>
											<thead>
												<tr>
													<th scope="col">Date</th>
													<th scope="col">IP</th>
												</tr>
											</thead>
											<tbody>
												{{range .History}}
												<tr>
													<td>{{.Date}}</td>
													<td>{{.IP}}</td>
												</tr>
												{{end}}
											</tbody>
										 </table>
										 <ul class="actions">
											<li>
												<form method="POST" action="/sendremove" style="display:inline;" onsubmit="return confirm('Are you sure you want to remove your IP history?');">
													<button type="submit" class="button" role="button" aria-label="Remove IP history" style="cursor: pointer;">Remove</button>
												</form>
											</li>
										</ul>
									</div>
								</div>
							</section>
				<!-- Footer -->
					<footer id="footer">
						<p class="copyright">&copy; <a href="http://git.imdhson.com/">dhson</a>. Design: <a href="https://html5up.net">HTML5 UP</a>. <a href="https://github.com/imdhson/ipdb.kr">Github</a>. <a href="/terms">Terms</a>. <a href="#header" class="scrolly">Go to Top</a>.</p>
					</footer>
			</div>

		<!-- Scripts -->
			<script src="/assets/js/jquery.min.js"></script>
			<script src="/assets/js/jquery.scrollex.min.js"></script>
			<script src="/assets/js/jquery.scrolly.min.js"></script>
			<script src="/assets/js/skel.min.js"></script>
			<script src="/assets/js/util.js"></script>
			<!--[if lte IE 8]><script src="/assets/js/ie/respond.min.js"></script><![endif]-->
			<script src="/assets/js/main.js"></script>

	</body>
</html>
