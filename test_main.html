<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>127.0.0.1 - IP Dashboard</title>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="assets/css/main.css" />
	</head>
	<body>
		<div id="wrapper">
			<header id="header" class="alt">
				<h1>
					<span tabindex="0" role="button" aria-label="Copy IP address: 127.0.0.1" title="Click to copy IP" style="cursor: pointer; border-bottom: 2px dashed rgba(255,255,255,0.25);" onclick="navigator.clipboard.writeText('127.0.0.1').then(() => { var h2 = this.parentElement.nextElementSibling; var orig = h2.innerText; if (orig === 'Copied!') return; h2.innerText = 'Copied!'; setTimeout(() => { h2.innerText = orig; }, 2000); }).catch(() => { /* ignore */ })" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">127.0.0.1</span>
				</h1>
				<h2>Your IP Address.</h2>
				<p>by <a href="/">ip.cciicc.cc</a></p>
			</header>
		</div>
	</body>
</html>
